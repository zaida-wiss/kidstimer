<div class="row" [class]="task().color">
  <span class="handle" cdkDragHandle title="Dra för att flytta">⠿</span>
  <button class="icon" (click)="iconClick.emit()" title="Byt bild">{{ task().icon }}</button>
  <input class="name" [value]="task().name" (input)="onNameInput($event)" />
  <button class="round" (click)="minus.emit()" aria-label="Minska">−</button>
  <div class="minutes">
    <strong>{{ task().minutes }}</strong>
    <small>min</small>
  </div>
  <button class="round" (click)="plus.emit()" aria-label="Öka">+</button>
  <button class="round" (click)="remove.emit()" aria-label="Ta bort">🗑️</button>
</div>
